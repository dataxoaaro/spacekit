# JavaScript and TypeScript: package managers, runtimes, framework build caches and browser binaries.
# Schema: docs/RULES.md
group: JavaScript
category: developer.cache

rules:
  # Project artifacts

  - id: node.node-modules
    name: node_modules
    description: Installed dependencies of a JavaScript project. Recreated by npm, pnpm, yarn or bun install from the lockfile.
    category: developer.dependencies
    match:
      names: [node_modules]
      sibling: [package.json]
    recreatedBy: npm / pnpm / yarn / bun install
    safety:
      level: safe
      trash: false
    policy:
      type: age
      olderThan: 60d
      schedule: weekly
      mode: suggest
    action: remove

  - id: node.nextjs-build
    name: Next.js .next folders
    description: Next.js build output and its fetch/image cache. Rebuilt by next dev or next build.
    category: developer.build
    match:
      names: [.next]
      sibling: [package.json]
    recreatedBy: next dev / next build
    safety:
      level: safe
      trash: false
    policy:
      type: age
      olderThan: 30d
      mode: suggest
    action: remove

  - id: node.turbo-cache
    name: Turborepo .turbo folders
    description: Turborepo's local task cache and run logs. Tasks run uncached once, then the cache refills.
    category: developer.build
    match:
      names: [.turbo]
      sibling: [package.json]
    recreatedBy: turbo run
    safety:
      level: safe
      trash: false
    policy:
      type: age
      olderThan: 30d
      mode: suggest
    action: remove

  - id: node.parcel-cache
    name: Parcel .parcel-cache folders
    description: Parcel's build cache. The next build is slower while it refills.
    category: developer.build
    match:
      names: [.parcel-cache]
      sibling: [package.json]
    recreatedBy: parcel
    safety:
      level: safe
      trash: false
    action: remove

  - id: node.nuxt-build
    name: Nuxt .nuxt folders
    description: Files Nuxt generates for development and builds. Regenerated by nuxi dev or nuxi build.
    category: developer.build
    match:
      names: [.nuxt]
      sibling: [package.json]
    recreatedBy: nuxi dev / nuxi build
    safety:
      level: safe
      trash: false
    action: remove

  - id: node.sveltekit-build
    name: SvelteKit .svelte-kit folders
    description: Generated types and build output of SvelteKit projects. Regenerated by vite dev, vite build or svelte-kit sync.
    category: developer.build
    match:
      names: [.svelte-kit]
      sibling: [package.json]
    recreatedBy: vite dev / vite build
    safety:
      level: safe
      trash: false
    action: remove

  - id: node.angular-cache
    name: Angular .angular cache
    description: The Angular CLI's persistent build cache. The next ng build or ng serve is slower while it refills.
    category: developer.build
    match:
      names: [.angular]
      sibling: [angular.json]
    recreatedBy: ng build / ng serve
    safety:
      level: safe
      trash: false
    action: remove

  # Package manager caches

  - id: node.npm-cache
    name: npm cache
    description: npm's content-addressable package cache. Packages are downloaded again when a project needs them.
    path: ~/.npm/_cacache
    recreatedBy: npm install
    safety: safe
    policy:
      type: size
      threshold: 5GB
      schedule: monthly
      mode: suggest
    action:
      command: [npm, cache, clean, --force]
    docs: https://docs.npmjs.com/cli/commands/npm-cache

  - id: node.npx-cache
    name: npx cache
    description: Packages downloaded by npx to run one-off commands. Downloaded again the next time you npx them.
    path: ~/.npm/_npx
    granularity: children
    recreatedBy: npx
    safety: safe
    policy:
      type: age
      olderThan: 30d
      mode: suggest
    action: remove

  - id: node.pnpm-store
    name: pnpm store
    description: pnpm's content-addressable store, hard-linked into every project's node_modules. pnpm store prune removes only packages no project references.
    path:
      - ~/Library/pnpm/store
      - ~/.pnpm-store
    recreatedBy: pnpm install
    safety: safe
    policy:
      type: schedule
      schedule: monthly
      mode: suggest
    action:
      command: [pnpm, store, prune]
    docs: https://pnpm.io/cli/store

  - id: node.pnpm-cache
    name: pnpm metadata cache
    description: Package metadata and pnpm dlx downloads. Fetched again on demand.
    path: ~/Library/Caches/pnpm
    recreatedBy: pnpm
    safety: safe
    action: remove

  - id: node.yarn-cache
    name: Yarn cache
    description: Yarn 1 global cache and the Yarn 2+ global cache. Packages are downloaded again on the next yarn install.
    path:
      - ~/Library/Caches/Yarn
      - ~/.yarn/berry/cache
    recreatedBy: yarn install
    safety: safe
    policy:
      type: size
      threshold: 5GB
      schedule: monthly
      mode: suggest
    action: remove

  - id: node.bun-cache
    name: Bun install cache
    description: Bun's global package cache. Packages are downloaded again on the next bun install.
    path: ~/.bun/install/cache
    recreatedBy: bun install
    safety: safe
    policy:
      type: size
      threshold: 5GB
      schedule: monthly
      mode: suggest
    action:
      command: [bun, pm, cache, rm]
    docs: https://bun.sh/docs/install/cache

  - id: node.corepack-cache
    name: Corepack cache
    description: Package manager versions (pnpm, yarn) downloaded by Corepack. Downloaded again when a project asks for them.
    path: ~/.cache/node/corepack
    recreatedBy: Corepack
    safety: safe
    action: remove

  - id: node.deno-cache
    name: Deno cache
    description: Deno's DENO_DIR with remote modules, npm packages and compiled code. Downloaded and compiled again on the next run.
    path: ~/Library/Caches/deno
    recreatedBy: deno run / deno install
    safety: safe
    action:
      command: [deno, clean]

  # Tooling caches

  - id: node.electron-cache
    name: Electron downloads
    description: Electron releases and electron-builder tools downloaded while building Electron apps. Downloaded again on the next build.
    path:
      - ~/Library/Caches/electron
      - ~/Library/Caches/electron-builder
    recreatedBy: electron / electron-builder
    safety: safe
    action: remove

  - id: node.node-gyp
    name: node-gyp headers
    description: Node.js headers node-gyp downloads to compile native modules. Downloaded again the next time a native module builds.
    path:
      - ~/Library/Caches/node-gyp
      - ~/.node-gyp
    recreatedBy: node-gyp
    safety: safe
    action: remove

  - id: node.typescript-cache
    name: TypeScript type acquisition cache
    description: Type definitions the TypeScript language server downloads for editors, one folder per TypeScript version.
    path: ~/Library/Caches/typescript
    granularity: children
    recreatedBy: Your editor's TypeScript server
    safety: safe
    action: remove

  # Runtimes and browser binaries

  - id: node.nvm-versions
    name: nvm Node.js versions
    description: Node.js versions installed with nvm, including each version's global npm packages. Removing your default version breaks node until you reinstall it.
    category: developer.toolchains
    path: ~/.nvm/versions/node
    granularity: children
    recreatedBy: nvm install
    safety: review
    policy:
      type: age
      olderThan: 180d
      mode: suggest
    action: remove

  - id: node.nvm-cache
    name: nvm download cache
    description: Node.js archives nvm downloaded while installing versions.
    path: ~/.nvm/.cache
    recreatedBy: nvm install
    safety: safe
    action: remove

  - id: node.volta-versions
    name: Volta Node.js versions
    description: Node.js versions Volta has fetched. Volta downloads a version again when a project pins it.
    category: developer.toolchains
    path: ~/.volta/tools/image/node
    granularity: children
    recreatedBy: Volta, on demand
    safety: review
    action: remove

  - id: node.playwright-browsers
    name: Playwright browsers
    description: Browser builds downloaded by Playwright, one folder per browser and revision. Old revisions stay after upgrades.
    path: ~/Library/Caches/ms-playwright
    granularity: children
    recreatedBy: npx playwright install
    safety: review
    policy:
      type: age
      olderThan: 60d
      mode: suggest
    action: remove
    docs: https://playwright.dev/docs/browsers

  - id: node.puppeteer-browsers
    name: Puppeteer browsers
    description: Chrome builds downloaded by Puppeteer. Downloaded again on the next npm install of puppeteer.
    path: ~/.cache/puppeteer
    granularity: children
    recreatedBy: npm install puppeteer / npx puppeteer browsers install
    safety: review
    action: remove

  - id: node.cypress-cache
    name: Cypress binaries
    description: Cypress app binaries, one folder per version. Old versions stay after upgrades.
    path: ~/Library/Caches/Cypress
    granularity: children
    recreatedBy: npm install cypress
    safety: review
    policy:
      type: age
      olderThan: 60d
      mode: suggest
    action: remove

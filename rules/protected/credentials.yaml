# Credentials and keys. All protected: SpaceKit shows them and never removes them, nor any folder
# that contains them (so a cache rule can never take a token file with it).
# Schema: docs/RULES.md
group: Credentials & keys
category: personal.credentials

rules:
  - id: credentials.ssh
    name: SSH keys
    description: Your SSH keys, known hosts and SSH configuration.
    path: ~/.ssh
    safety: protected

  - id: credentials.gnupg
    name: GnuPG keys
    description: Your GPG keyrings and trust database, used for signing commits and encrypting files.
    path: ~/.gnupg
    safety: protected

  - id: credentials.keychains
    name: Keychains
    description: Your login keychain and other keychains with passwords, certificates and keys.
    path: ~/Library/Keychains
    safety: protected

  - id: credentials.cloud
    name: Cloud and cluster credentials
    description: Credentials and configuration for AWS, Google Cloud, Azure and Kubernetes clusters.
    path:
      - ~/.aws
      - ~/.config/gcloud
      - ~/.azure
      - ~/.kube
    safety: protected

  - id: credentials.git-hosting
    name: Git hosting tokens
    description: Tokens for GitHub CLI, GitHub Copilot and git's plain-text credential store, plus machine logins in .netrc.
    path:
      - ~/.config/gh
      - ~/.config/github-copilot
      - ~/.git-credentials
      - ~/.netrc
    safety: protected

  - id: credentials.registries
    name: Package registry tokens
    description: Login tokens for container and package registries (Docker, npm, PyPI, crates.io, RubyGems, Maven).
    path:
      - ~/.docker/config.json
      - ~/.npmrc
      - ~/.pypirc
      - ~/.cargo/credentials.toml
      - ~/.cargo/credentials
      - ~/.gem/credentials
      - ~/.m2/settings-security.xml
    safety: protected

  - id: credentials.android
    name: Android debug signing and adb keys
    description: The debug keystore that signs your debug builds (API keys and sign-in configs are tied to its fingerprint) and the key adb uses to authorise devices.
    path:
      - ~/.android/debug.keystore
      - ~/.android/adbkey
      - ~/.android/adbkey.pub
    safety: protected

  - id: credentials.ai-tools
    name: AI tool credentials
    description: The Ollama identity key, Codex CLI login and Hugging Face access tokens.
    path:
      - ~/.ollama/id_ed25519
      - ~/.ollama/id_ed25519.pub
      - ~/.codex/auth.json
      - ~/.cache/huggingface/token
      - ~/.cache/huggingface/stored_tokens
    safety: protected
